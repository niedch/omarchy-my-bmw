[tasks.run-quickshell]
description = "Launch QuickShell with dev-shell.qml"
run = """
DEV_DIR="$PWD/.dev"
SESSION_ID="${OMARCHY_SESSION_ID:-${HYPRLAND_INSTANCE_SIGNATURE:-omarchy-dev-session}}"
mkdir -p "$DEV_DIR/.local/state/omarchy"
echo "$SESSION_ID" > "$DEV_DIR/.local/state/omarchy/background-intro.session-id"

HOME="$DEV_DIR" quickshell "$@"
"""

[tasks.lint]
description = "Lint JavaScript and QML files"
run = """
shopt -s nullglob
files=(*.qml components/*.qml)
if [ -n "${files[*]}" ]; then
  qmllint -E "${files[@]}"
fi
"""

[tasks.format]
description = "Format JavaScript, QML, and Nix files in-place"
run = """
shopt -s nullglob
files=(*.qml components/*.qml)
if [ -n "${files[*]}" ]; then
  qmlformat -i "${files[@]}"
fi
alejandra flake.nix
"""

[tasks.check-format]
description = "Check formatting of JavaScript, QML, and Nix files"
run = """
shopt -s nullglob
for f in *.qml components/*.qml; do [ -f "$f" ] && qmlformat "$f" | diff -u "$f" - || exit 1; done
alejandra --check flake.nix
"""

[tasks.check-quickshell]
description = "Run the dev shell briefly and verify it boots and renders without graphics errors"
run = """
LOG="${TMPDIR:-/tmp}/omarchy-my-bmw-check-quickshell.log"
rm -f "$LOG"

# Run in a new process group so we can kill the whole tree (mise sh wrapper + quickshell) on exit
setsid mise run run-quickshell >"$LOG" 2>&1 &
QSPID=$!

trap 'kill -- -$QSPID 2>/dev/null' EXIT

sleep 12

status=0

if ! kill -0 $QSPID 2>/dev/null; then
  echo "FAIL: quickshell exited early"
  status=1
fi

if grep -E "Failed to create (RHI|graphics context)|Failed to initialize graphics backend" "$LOG"; then
  echo "FAIL: graphics context errors detected"
  status=1
fi

if ! grep -q "service-ready" "$LOG"; then
  echo "FAIL: shell did not report service-ready"
  status=1
fi

if [ $status -eq 0 ]; then
  echo "PASS: dev shell ran without graphics errors"
fi

[ $status -eq 0 ]
"""
